# Controlli automatici di GoatLink.
#  - A ogni modifica (push o pull request) lancia controlla_sito.py:
#    se trova errori la modifica risulta rossa su GitHub e non va pubblicata.
#  - Ogni mattina rigenera guide, sitemap e home da data.js, cosi' scadenze e
#    maggiorazioni si aggiornano da sole anche nell'HTML. Se dopo la
#    rigenerazione il controllo passa, pubblica; se non passa, il job fallisce
#    e GitHub manda una mail: c'e' qualcosa da sistemare a mano.
#  - Nello stesso giro rigenera i contenuti social (contenuti/) e scrive il
#    piano del giorno come commento nella issue "Cosa pubblicare oggi":
#    arriva come notifica sull'app GitHub e per mail.
name: Controlli sito

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # 06:17 ora italiana (05:17 con l'ora solare)

jobs:
  controlla:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controllo del sito
        run: python3 controlla_sito.py

  aggiorna:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rigenera da data.js
        run: |
          python3 genera_sito.py
          python3 genera_contenuti.py
      - name: Controllo del sito
        run: python3 controlla_sito.py
      - name: Pubblica se e' cambiato qualcosa
        run: |
          git add -A contenuti
          if git diff --cached --quiet && git diff --quiet; then
            echo "Niente da aggiornare oggi."
          else
            git config user.name "GoatLink bot"
            git config user.email "actions@github.com"
            git commit -am "Aggiornamento automatico del $(date +%F)"
            git push
          fi
      - name: Piano del giorno nella issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create contenuti --color FFD400 --description "Piano contenuti quotidiano" --force
          N=$(gh issue list --label contenuti --state open --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then
            URL=$(gh issue create --label contenuti --title "📅 Cosa pubblicare oggi" \
              --body "Ogni mattina qui sotto arriva il piano del giorno, generato da data.js. Kit completi per ogni promo nella cartella contenuti/promo/.")
            N=${URL##*/}
          fi
          { echo "@${{ github.repository_owner }} piano del giorno 👇"; echo; cat contenuti/oggi.md; } > /tmp/oggi.md
          gh issue comment "$N" --body-file /tmp/oggi.md
