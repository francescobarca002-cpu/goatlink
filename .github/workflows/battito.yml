# =====================================================================
#  GoatLink — battito
#
#  Due cose si spengono da sole se nessuno le usa, e quando succede
#  il login smette di funzionare senza che nessuno se ne accorga:
#
#    1. il progetto Supabase del piano gratuito, dopo 7 giorni senza
#       attivita sul database
#    2. la chiave SMTP di Brevo, dopo 90 giorni di inattivita
#
#  Questo lavoro tiene svegli entrambi. Ogni giorno interroga il
#  database; ogni due mesi chiede un link di accesso, che passa da
#  Supabase a Brevo e tiene viva anche la chiave.
#
#  Non contiene nessuna credenziale: URL e chiave li legge da
#  percorso.js, e quella chiave e gia pubblica nel sorgente del sito.
#
#  DA FARE UNA VOLTA SOLA per attivare la parte email:
#  Settings → Secrets and variables → Actions → scheda Variables →
#  New repository variable, nome EMAIL_SERVIZIO, valore un indirizzo
#  tuo che gia esiste tra gli utenti Supabase. Se non la imposti,
#  il battito del database funziona lo stesso e l'email viene saltata.
# =====================================================================

name: Battito

on:
  schedule:
    - cron: '17 6 * * *'        # ogni giorno, 6:17 UTC — tiene sveglio il database
    - cron: '17 7 1 */2 *'      # il 1 di ogni due mesi — tiene viva la chiave SMTP
  workflow_dispatch:            # pulsante manuale, per provarlo subito

permissions:
  contents: read

jobs:
  battito:
    runs-on: ubuntu-latest
    steps:

      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Leggi URL e chiave da percorso.js
        id: cfg
        run: |
          set -euo pipefail
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" percorso.js | head -1)
          KEY=$(sed -n "s/.*chiave:[[:space:]]*'\([^']*\)'.*/\1/p" percorso.js | head -1)

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Non trovo url o chiave dentro percorso.js."
            exit 1
          fi
          if printf '%s' "$KEY" | grep -qi 'INCOLLA'; then
            echo "::error::In percorso.js c'e ancora il segnaposto al posto della chiave."
            exit 1
          fi
          if printf '%s' "$KEY" | grep -qiE '^sb_secret_'; then
            echo "::error::In percorso.js c'e una chiave di servizio. Fermati e sostituiscila."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY"   >> "$GITHUB_OUTPUT"
          echo "Progetto: $URL"

      - name: Sveglia il database
        run: |
          set -euo pipefail
          RISPOSTA=$(mktemp)
          CODICE=$(curl -sS -o "$RISPOSTA" -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 10 \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            "${{ steps.cfg.outputs.url }}/rest/v1/battito?select=visto&limit=1")

          echo "HTTP $CODICE"
          if [ "$CODICE" != "200" ]; then
            echo "::error::Il database non ha risposto come previsto. Corpo della risposta:"
            cat "$RISPOSTA"
            exit 1
          fi
          echo "Database sveglio."

      - name: Tieni viva la chiave SMTP
        # Solo sulla pianificazione bimestrale, o quando lo lanci a mano.
        if: github.event.schedule == '17 7 1 */2 *' || github.event_name == 'workflow_dispatch'
        env:
          DESTINATARIO: ${{ vars.EMAIL_SERVIZIO }}
        run: |
          set -euo pipefail
          if [ -z "${DESTINATARIO:-}" ]; then
            echo "EMAIL_SERVIZIO non impostata: salto l'invio."
            echo "La chiave SMTP di Brevo scade dopo 90 giorni senza invii."
            exit 0
          fi

          RISPOSTA=$(mktemp)
          CODICE=$(curl -sS -o "$RISPOSTA" -w '%{http_code}' \
            --max-time 30 \
            -X POST "${{ steps.cfg.outputs.url }}/auth/v1/otp" \
            -H "apikey: ${{ steps.cfg.outputs.key }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${DESTINATARIO}\",\"create_user\":false}")

          echo "HTTP $CODICE"
          if [ "$CODICE" != "200" ]; then
            echo "::error::Invio non riuscito. Se leggi un errore SMTP, la chiave Brevo"
            echo "::error::e scaduta o e stata revocata: rigenerala e aggiornala su Supabase."
            cat "$RISPOSTA"
            exit 1
          fi
          echo "Email di servizio inviata: la catena Supabase → Brevo funziona."
